# 错题本小程序 —— Nginx 反向代理配置（生产环境）
#
# 部署位置（示例）：/etc/nginx/conf.d/error-learn.conf
# 目标形态：阿里云 ECS 自建 + 已备案子域名 HTTPS + 后端 uvicorn 监听 127.0.0.1:8000
#
# 占位符（部署时必须替换，共 3 处）：
#   1) api.example.com               → 你的已备案子域名
#   2) /etc/nginx/ssl/api.example.com.pem  → SSL 证书链路径（fullchain）
#   3) /etc/nginx/ssl/api.example.com.key  → SSL 私钥路径
#
# 前置：本文件假设服务器上已存在 Nginx（可能已被其它站点占用 80/443）。
#       若复用现有 Nginx，只需新增本 server 块并 reload，不要 restart。

# ---- HTTP：仅保留 ACME 校验 + 跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # acme.sh / certbot 的 HTTP-01 校验目录（若用 DNS-01 可删除本 location）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：API 反代 + 静态资源 ----
server {
    # Nginx ≥ 1.25.1 用下面这行；Ubuntu 24.04 apt 版（1.24.0）请改用：
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;

    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

    # 微信小程序要求 TLS ≥ 1.2 且支持 ECDHE
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传体积：单张图片上限 10MB，留足表单开销
    client_max_body_size 20m;

    # 访问日志（按需开启）
    access_log /var/log/nginx/error-learn.access.log;
    error_log  /var/log/nginx/error-learn.error.log;

    # ---- API 反向代理 → uvicorn(127.0.0.1:8000) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 识别接口可能耗时，放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- 头像等静态资源（对应后端 UPLOADS_DIR，FastAPI 挂载在 /static）----
    location /static/ {
        alias /opt/error-learn/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- 健康检查（运维探活，可保留）----
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        access_log off;
    }
}
